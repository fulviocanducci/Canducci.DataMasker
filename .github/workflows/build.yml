name: Build and Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Canducci.DataMasker.slnx

      - name: Run tests
        run: dotnet test Canducci.DataMasker.slnx --configuration Release --no-restore

      - name: Pack NuGet
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack Canducci.DataMasker/Canducci.DataMasker.csproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            -p:PackageVersion="$VERSION"

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
